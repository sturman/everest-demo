name: build-images

# Builds the demo images (manager, mqtt-server, nodered) and publishes them to
# this repository's GitHub Container Registry namespace, e.g.
# ghcr.io/<owner>/everest-demo/manager:<TAG from .env>.
# Each architecture is built on a native runner (EVerest is too slow to compile
# under QEMU) and the per-arch images are merged into one multi-arch manifest.

on:
  push:
    branches:
      - build/everest-2026.02.1
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      tag: ${{ steps.vars.outputs.TAG }}
      host_namespace: ${{ steps.vars.outputs.HOST_NAMESPACE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read image version and registry namespace
        id: vars
        shell: bash
        run: |
          if ! [[ -s '.env' ]]; then
            echo 'Error: No .env file found.'
            exit 1
          fi

          if ! grep -qE '^TAG=' .env; then
            echo 'Error: .env must contain a TAG variable.'
            exit 1
          fi

          source .env
          echo "TAG=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "HOST_NAMESPACE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "${GITHUB_OUTPUT}"

  build:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        image:
          - name: manager
            context: ./manager
          - name: mqtt-server
            context: ./mosquitto
          - name: nodered
            context: ./nodered
        platform:
          - linux/amd64
          - linux/arm64
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm

    env:
      IMAGE: ${{ needs.prepare.outputs.host_namespace }}/${{ matrix.image.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The EVerest compile needs more disk than a stock runner has free
      - name: Free disk space
        if: matrix.image.name == 'manager'
        shell: bash
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set Docker image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}

      - name: Log into GitHub container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.arch }}

      - name: Export digest
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.image.name }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [prepare, build]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        image_name: [manager, mqtt-server, nodered]

    env:
      IMAGE: ${{ needs.prepare.outputs.host_namespace }}/${{ matrix.image_name }}

    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image_name }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set Docker image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.tag }}
            type=sha

      - name: Log into GitHub container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        shell: bash
        run: |
          # shellcheck disable=SC2046 # word splitting into -t/digest args is intended
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "${DOCKER_METADATA_OUTPUT_JSON}") \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect image
        shell: bash
        run: |
          docker buildx imagetools inspect "${IMAGE}:${{ needs.prepare.outputs.tag }}"
